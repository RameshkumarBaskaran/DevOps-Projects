apiVersion: apps/v1
kind: Deployment

metadata:
  name: storage-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: storage-demo

  template:
    metadata:
      labels:
        app: storage-demo

    spec:
      containers:
      - name: ubuntu
        image: ubuntu:22.04

        command:
        - "/bin/bash"
        - "-c"
        - "while true; do sleep 3600; done"

        volumeMounts:
        - mountPath: /data
          name: my-storage

      volumes:
      - name: my-storage
        persistentVolumeClaim:
          claimName: demo-pvc