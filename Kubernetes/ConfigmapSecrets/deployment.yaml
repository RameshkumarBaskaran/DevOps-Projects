apiVersion: apps/v1
kind: Deployment

metadata:
  name: config-demo
  namespace: dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: config-demo

  template:
    metadata:
      labels:
        app: config-demo

    spec:
      containers:
      - name: nginx
        image: nginx

        env:

        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_NAME

        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ENVIRONMENT

        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: username

        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: password