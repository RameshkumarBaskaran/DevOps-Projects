spec:
  containers:
    - name: cloudops-ai
      image: rameshbaskaran/cloudops-ai:0.2.0
      imagePullPolicy: IfNotPresent

      ports:
        - containerPort: 8000

      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10

      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 20